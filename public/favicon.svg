<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="50%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="25%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#e6c65b"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded conservatory badge background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  
  <!-- Subtle inner ornamental ring -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6"/>

  <!-- Treble Clef Glyph & Musical Harmony Symbol -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="258" font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="340" font-weight="900">𝄞</text>
  </g>
  
  <!-- Subtle sparkles -->
  <circle cx="120" cy="140" r="4" fill="#fff3b0" opacity="0.8"/>
  <circle cx="390" cy="120" r="6" fill="#fff3b0" opacity="0.9"/>
  <circle cx="380" cy="380" r="4" fill="#fff3b0" opacity="0.7"/>
</svg>
